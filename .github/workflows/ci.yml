name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CMAKE_BUILD_PARALLEL_LEVEL: "2"
  PYTHONFAULTHANDLER: "1"
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"

jobs:
  sdist:
    name: Build source distribution
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: false
      - run: uv sync --locked --only-group release
      - name: Verify release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: uv run --no-sync --only-group release python .github/scripts/check_release.py
      - name: Build source distribution
        run: uv build --sdist --no-sources
      - name: Validate source distribution
        run: |
          uv run --no-sync --only-group release python .github/scripts/check_sdist.py dist/pymarvin-*.tar.gz
          uv run --no-sync --only-group release twine check --strict dist/*.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pymarvin-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  wheels:
    needs: sdist
    name: ${{ matrix.platform }} / CPython 3.10–3.14
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: windows-amd64
            runner: windows-2022
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Build, repair and test installed wheels
        run: uvx --python 3.12 cibuildwheel==4.3.3 --output-dir wheelhouse
      - name: Upload tested wheels
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pymarvin-wheels-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7

  artifacts:
    name: Validate and collect distribution artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Download validated source archive
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pymarvin-sdist
          path: dist
      - name: Download tested platform wheels
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: pymarvin-wheels-*
          path: dist
          merge-multiple: true
      - name: Validate complete distribution set
        run: |
          uv sync --locked --only-group release
          uv run --no-sync --only-group release python .github/scripts/check_wheels.py dist
          uv run --no-sync --only-group release twine check --strict dist/*
      - name: Save publishable distributions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pymarvin-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  test:
    name: Linux / Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Build and install the integrated SDK
        run: uv sync --locked --no-editable --group test --group release --group docs
      - name: Check formatting
        run: uv run --no-sync black --check src/pymarvin tests docs examples .github/scripts
      - name: Run offline tests
        run: uv run --no-sync pytest -q
      - name: Check dependencies
        run: uv pip check

  documentation:
    name: Build bilingual documentation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Build binding and install Sphinx
        run: uv sync --locked --no-editable --no-default-groups --group docs
      - name: Check Chinese translation catalogs
        run: |
          uv run --no-sync sphinx-build -E -n -W --keep-going -b gettext -D language=en docs docs/_build/gettext
          uv run --no-sync python docs/_ext/check_translations.py docs/_build/gettext
      - name: Build bilingual documentation
        run: |
          uv run --no-sync sphinx-build -E -n -W --keep-going -b html -D language=en docs docs/_build/en
          uv run --no-sync sphinx-build -E -n -W --keep-going -b html -D language=zh_CN docs docs/_build/zh_CN
      - name: Save documentation preview
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pymarvin-docs
          path: |
            docs/_build/en
            docs/_build/zh_CN
          if-no-files-found: warn

  coverage:
    name: Python and native coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.1"
          python-version: "3.12"
          enable-cache: true
      - name: Build instrumented binding
        run: >-
          uv sync --locked --no-editable --group test --group docs --group native-coverage
          --no-build-isolation-package pymarvin
          -Ccmake.define.PYMARVIN_ENABLE_COVERAGE=ON -Cbuild-dir=build/coverage
      - name: Run tests with Python branch coverage
        run: uv run --no-sync coverage run -m pytest -q
      - name: Write Python coverage
        if: always()
        run: |
          uv run --no-sync coverage xml
          uv run --no-sync coverage report --fail-under=95
      - name: Write native coverage
        if: always()
        run: >-
          uv run --no-sync gcovr --root . --filter 'src/bindings/' --merge-lines
          --xml-pretty --output coverage-native.xml --print-summary
          --fail-under-line 75 build/coverage
      - name: Save coverage reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-reports
          path: coverage-*.xml
          if-no-files-found: error
      - name: Upload Python coverage
        if: >-
          success() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-python.xml
          flags: python
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
      - name: Upload native coverage
        if: >-
          success() && (github.event_name != 'pull_request' ||
          github.event.pull_request.head.repo.full_name == github.repository)
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          files: coverage-native.xml
          flags: native
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
