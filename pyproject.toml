[build-system]
requires = ["scikit-build-core>=0.11,<0.12", "nanobind>=3.1,<4"]
build-backend = "scikit_build_core.build"

[project]
name = "pymarvin"
version = "0.1.0"
description = "Nanobind bindings for Tianji Marvin robot control, kinematics and interference SDKs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT AND Apache-2.0 AND BSD-3-Clause"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/pymarvin/licenses/*/LICENSE", "src/pymarvin/licenses/*/NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/slabpanic/pymarvin"
Repository = "https://github.com/slabpanic/pymarvin"
Issues = "https://github.com/slabpanic/pymarvin/issues"
Documentation = "https://pymarvin.readthedocs.io/en/latest/"

[dependency-groups]
dev = ["black>=26.10.1"]
test = ["pytest>=8,<10", "coverage[toml]>=7.13,<8"]
release = ["packaging>=24,<27", "twine>=6,<7"]
native-coverage = ["gcovr>=8.6,<9", "nanobind>=3.1,<4", "scikit-build-core>=0.11,<0.12"]
docs = ["sphinx>=8,<9", "furo>=2024.8.6,<2027", "babel>=2.15,<3"]

[tool.scikit-build]
minimum-version = "build-system.requires"
wheel.packages = ["src/pymarvin"]
sdist.include = ["CMakeLists.txt", "src/**", "tests/*.py", "docs/*.rst", "docs/*.py", "docs/_ext/*.py", "docs/_templates/*.html", "docs/locale/*/LC_MESSAGES/*.po", "examples/**", "THIRD_PARTY_NOTICES.md", "README.zh-CN.md", ".readthedocs.yaml", "codecov.yml", ".gitattributes", ".github/scripts/*.py"]
sdist.exclude = ["docs/_build/**", "docs/api/_generated/**", "**/__pycache__/**", "**/*.so", "**/*.pyd", "**/*.dll", "docs/locale/**/*.mo"]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "CMakeLists.txt" }, { file = "src/**" }]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*-musllinux_* *-win32 *-manylinux_i686"
build-frontend = "uv"
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "2", PYTHONUTF8 = "1" }
test-requires = ["pytest>=8,<10", "babel>=2.15,<3", "packaging>=24,<27"]
test-command = 'python -m pytest "{project}/tests" -q'
test-environment = { PYTEST_DISABLE_PLUGIN_AUTOLOAD = "1" }

[tool.cibuildwheel.linux]
archs = ["auto64"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.black]
target-version = ["py310"]

[tool.coverage.run]
branch = true
source = ["pymarvin"]
relative_files = true

[tool.coverage.paths]
pymarvin = ["src/pymarvin", "*/site-packages/pymarvin"]

[tool.coverage.report]
show_missing = true
precision = 2

[tool.coverage.xml]
output = "coverage-python.xml"
