version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    - g++
  jobs:
    post_create_environment:
      - python -m pip install uv==0.12.1
    install:
      - >-
        CMAKE_BUILD_PARALLEL_LEVEL=2 UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH"
        uv sync --locked --inexact --no-default-groups --group docs --no-editable
        --python "$READTHEDOCS_VIRTUALENV_PATH/bin/python"
    build:
      html:
        - python -m sphinx -E -n -W --keep-going -b gettext -D language=en docs docs/_build/gettext
        - python docs/_ext/check_translations.py docs/_build/gettext
        - python -m sphinx -E -n -W --keep-going -b html docs "$READTHEDOCS_OUTPUT/html"
sphinx:
  configuration: docs/conf.py
  fail_on_warning: true
